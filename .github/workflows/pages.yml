name: Deploy lessons to GitHub Pages

on:
  push:
    branches: [claude/mattpocock-teach-skill-download-qgkt6p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r lessons _site/lessons
          cp -r reference _site/reference
          cp -r form-making _site/form-making
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Architecture — Teaching Series</title>
          <style>
          body { font-family: system-ui, -apple-system, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
          a { color: #0366d6; }
          </style>
          </head>
          <body>
          <h1>Architecture — Teaching Series</h1>
          <h2>Residential Space Planning</h2>
          <ul>
          <li><a href="lessons/0001-reading-a-floor-plan.html">Lesson 1 — Reading a Floor Plan</a></li>
          <li><a href="lessons/0002-zoning-a-home.html">Lesson 2 — Zoning a Home</a></li>
          <li><a href="lessons/0004-moving-through-a-home.html">Lesson 3 — Moving Through a Home</a></li>
          <li><a href="lessons/0005-light-and-orientation.html">Lesson 4 — Light &amp; Orientation</a></li>
          <li><a href="lessons/0006-room-sizes-and-clearances.html">Lesson 5 — Room Sizes &amp; Clearances</a></li>
          <li><a href="lessons/0007-capstone.html"><strong>Capstone — your plan through the toolkit</strong></a></li>
          <li><a href="lessons/0008-capstone-concepts.html">Capstone concepts — courtyard &amp; upper-floor sketches</a></li>
          </ul>
          <h2>Form-Making for the Pokuase Climate <span style="font-weight:normal;color:#888">(new)</span></h2>
          <ul>
          <li><a href="form-making/lessons/0001-climate-as-the-first-move.html">Lesson 1 — Climate as the First Move</a></li>
          <li><a href="form-making/lessons/0002-the-roof-as-primary-form.html">Lesson 2 — The Roof as Primary Form</a></li>
          <li><a href="form-making/lessons/0003-massing-for-breeze-and-shade.html">Lesson 3 — Massing for Breeze and Shade</a></li>
          </ul>
          <h2>Reference</h2>
          <ul>
          <li><a href="reference/zoning-cheatsheet.html">Zoning cheat-sheet</a></li>
          <li><a href="reference/glossary.html">Glossary</a></li>
          </ul>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
